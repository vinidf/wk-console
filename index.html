<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WaniKani Projection Console</title>
<style>html,body{margin:0;background:#0c0f14;color:#e8edf4;font-family:system-ui,sans-serif}body{padding:32px}.load{max-width:720px;margin:12vh auto;color:#8b97a8}.err{color:#ef5350;white-space:pre-wrap}</style>
</head>
<body>
<div class="load" id="load">Loading projection console…</div>
<script>
(async()=>{
  const source="https://raw.githubusercontent.com/vinidf/wk-console/4a468a08365e58f7ee88ca200aa1efa15940c7ee/index.html";
  const res=await fetch(source,{cache:"no-store"});
  if(!res.ok)throw new Error(`Could not load app source (${res.status})`);
  let s=await res.text();
  const swap=(a,b)=>{if(!s.includes(a))throw new Error("Projection patch target not found");s=s.replace(a,b);};
  const swapAll=(a,b,count)=>{const n=s.split(a).length-1;if(n!==count)throw new Error(`Projection patch target count ${n}, expected ${count}`);s=s.split(a).join(b);};

  swap(`        <option value="burst" selected>Burst 15 — radicals + kanji up to 15 items on level-up</option>\n        <option value="default">Default — follow lesson order normally</option>\n        <option value="radicals">Radicals first — do all radicals day 1</option>`,`        <option value="default">Default — follow lesson order normally</option>\n        <option value="radicals" selected>Radicals first — prioritize radicals within daily lessons</option>`);
  swap(`<div class="k">projected days/level</div>`,`<div class="k">days to next level</div>`);
  swap(`if(s.levelup!=null)$("#levelup").value=s.levelup;`,`if(s.levelup!=null)$("#levelup").value=s.levelup==="burst"?"radicals":s.levelup;`);

  swap(`function guruKToAccuracy(guruK){\n  // inverse of computeRealAccuracy's piecewise mapping (4.0d->90%, 4.5d->85%, 5.5d->75%)\n  if(guruK<=4.0)return 0.90;\n  if(guruK<=4.5)return 0.90-(guruK-4.0)/0.5*0.05;\n  if(guruK<=5.5)return 0.85-(guruK-4.5)/1.0*0.10;\n  return 0.75;\n}`,`function guruKToAccuracy(guruK){\n  let lo=0.5,hi=0.999;\n  for(let i=0;i<32;i++){\n    const mid=(lo+hi)/2;\n    if(expectedGuruTimes(mid)[0]>guruK)lo=mid;else hi=mid;\n  }\n  return (lo+hi)/2;\n}`);

  swap(`function computeRealAccuracy(){\n  // weighted accuracy across all kanji meaning+reading reviews\n  let correct=0,incorrect=0;\n  for(const r of STATE.rstats){\n    const d=r.data,s=STATE.sub[d.subject_id];\n    if(!s||s.type!=="kanji")continue;\n    correct+=d.meaning_correct+d.reading_correct;\n    incorrect+=d.meaning_incorrect+d.reading_incorrect;\n  }\n  const total=correct+incorrect;\n  if(!total)return null;\n  const acc=correct/total;\n  // linear interpolation: 90%->4.0d, 85%->4.5d, 75%->5.5d\n  // slope: -0.1d per 1% acc => (1-acc)*10 * 1 + 4.0 roughly\n  // piecewise: above 90% cap at 4.0, below 75% cap at 5.5\n  let lag;\n  if(acc>=0.90) lag=4.0;\n  else if(acc>=0.85) lag=4.0+(0.90-acc)/(0.05)*0.5;\n  else if(acc>=0.75) lag=4.5+(0.85-acc)/(0.10)*1.0;\n  else lag=5.5;\n  return {acc,lag,total};\n}`,`function computeRealAccuracy(){\n  let cleanSum=0,cleanWeight=0,radC=0,radI=0;\n  for(const r of STATE.rstats){\n    const d=r.data,s=STATE.sub[d.subject_id];\n    if(!s)continue;\n    if(s.type==="kanji"){\n      const mTotal=d.meaning_correct+d.meaning_incorrect;\n      const rTotal=d.reading_correct+d.reading_incorrect;\n      if(!mTotal||!rTotal)continue;\n      const meaningAcc=d.meaning_correct/mTotal;\n      const readingAcc=d.reading_correct/rTotal;\n      const reviews=Math.min(mTotal,rTotal);\n      cleanSum+=meaningAcc*readingAcc*reviews;\n      cleanWeight+=reviews;\n    } else if(s.type==="radical"){\n      radC+=d.meaning_correct;radI+=d.meaning_incorrect;\n    }\n  }\n  if(!cleanWeight)return null;\n  const acc=cleanSum/cleanWeight;\n  const lag=expectedGuruTimes(acc)[0];\n  const radAcc=(radC+radI)?radC/(radC+radI):null;\n  return {acc,lag,total:cleanWeight,radAcc};\n}`);

  swapAll(`  const L0=user.level,GURU_K=expectedGuruTimes(accuracy)[0],GURU_R=3.5,LPD=opts.lpd;`,`  const radicalAccuracy=opts.radAcc??accuracy;\n  const L0=user.level,GURU_K=expectedGuruTimes(accuracy)[0],GURU_R=expectedGuruTimes(radicalAccuracy)[0],LPD=opts.lpd;`,2);
  swap(`      radGuruEst=Math.max(radGuruEst,preciseGuruDay(d.srs_stage,d.available_at,NOW,accuracy));`,`      radGuruEst=Math.max(radGuruEst,preciseGuruDay(d.srs_stage,d.available_at,NOW,radicalAccuracy));`);
  swap(`    if((R[L0]||0)>0)radGuruEst=Math.max(radGuruEst,expectedGuruTimes(accuracy)[0]);`,`    if((R[L0]||0)>0)radGuruEst=Math.max(radGuruEst,GURU_R);`);
  swap(`      radGuruEst2=Math.max(radGuruEst2,preciseGuruDay(d.srs_stage,d.available_at,NOW.getTime(),accuracy));`,`      radGuruEst2=Math.max(radGuruEst2,preciseGuruDay(d.srs_stage,d.available_at,NOW.getTime(),radicalAccuracy));`);
  swap(`    if((R[L0]||0)>0)radGuruEst2=Math.max(radGuruEst2,expectedGuruTimes(accuracy)[0]);`,`    if((R[L0]||0)>0)radGuruEst2=Math.max(radGuruEst2,GURU_R);`);

  swap(`    births.push({day:nextDay,stage:d.srs_stage,anchored:!!d.available_at});`,`    births.push({day:nextDay,stage:d.srs_stage,kind:s.type==="radical"?"R":s.type==="kanji"?"K":"V",anchored:!!d.available_at});`);
  swap(`    births.push({day:day+STAGE_INTERVALS[0],stage:1}); // first review after the stage-1 interval`,`    births.push({day:day+STAGE_INTERVALS[0],stage:1,kind}); // first review after the stage-1 interval`);
  swap(`      const ok=Math.random()<accuracy;`,`      const ok=Math.random()<(b.kind==="R"&&opts.radAcc!=null?opts.radAcc:accuracy);`);

  swap(`  for(let l=L0+1;l<=60;l++)if(reached[l]!=null&&reached[l-1]!=null)deltas.push(reached[l]-reached[l-1]);`,`  for(let l=L0+2;l<=60;l++)if(reached[l]!=null&&reached[l-1]!=null)deltas.push(reached[l]-reached[l-1]);`);
  swap(`  $("#stBacklog").textContent=backlog;\n  $("#stPace").textContent=STATE.recentPace;\n  $("#stProj").textContent=projPace??"–";`,`  $("#stBacklog").textContent=backlog;\n  $("#stPace").textContent=STATE.recentPace;\n  $("#stProj").textContent=reached[L0+1]!=null?Math.max(0,Math.ceil(reached[L0+1])):"–";\n  $("#trajTag").textContent=projPace!=null?` + "`future median ${projPace}d/level`" + `:"projected";`);
  swap('    `${o.lpd} lessons/day · ${levelupLabel} · ${orderLabel} · kanji→Guru ≈${o.guruK}d avg · 90%-kanji level-up rule simulated per level`;','    `${o.lpd} lessons/day · ${levelupLabel} · ${orderLabel} · kanji→Guru ≈${o.guruK}d avg · radical→Guru ≈${expectedGuruTimes(o.radAcc??guruKToAccuracy(o.guruK))[0].toFixed(1)}d avg · 90%-kanji level-up rule simulated per level`;');

  swap(`  return{lpd:+$("#lpd").value,levelup:$("#levelup").value,order:$("#order").value,guruK};`,`  const picked=$("#acc").selectedOptions[0];\n  const measured=!!(picked&&picked.id==="accMeasured");\n  const radAcc=measured&&STATE&&STATE.measuredRadicalAcc!=null?STATE.measuredRadicalAcc:null;\n  return{lpd:+$("#lpd").value,levelup:$("#levelup").value,order:$("#order").value,guruK,radAcc};`);

  swap(`    measuredLag:STATE.measuredLag||null,`,`    measuredLag:STATE.measuredLag||null,\n    measuredRadicalAcc:STATE.measuredRadicalAcc??null,`);
  swap(`  return{user:c.user,prog,subs,asg,rstats,measuredLag:c.measuredLag,summary};`,`  return{user:c.user,prog,subs,asg,rstats,measuredLag:c.measuredLag,measuredRadicalAcc:c.measuredRadicalAcc,summary};`);
  swap(`  if(cache.measuredLag)STATE.measuredLag=cache.measuredLag;`,`  if(cache.measuredLag)STATE.measuredLag=cache.measuredLag;\n  if(cache.measuredRadicalAcc!=null)STATE.measuredRadicalAcc=cache.measuredRadicalAcc;`);
  swap('    opt.textContent=`Measured: → ${cache.measuredLag.toFixed(2)}d lag (cached)`;','    opt.textContent=`Measured clean-review est.: → ${cache.measuredLag.toFixed(2)}d avg to Guru (cached)`;');
  swap(`    STATE.measuredLag=result.lag;\n    const pct=(result.acc*100).toFixed(1);`,`    STATE.measuredLag=result.lag;\n    STATE.measuredRadicalAcc=result.radAcc;\n    const pct=(result.acc*100).toFixed(1);`);
  swap('    opt.textContent=`Measured: ${pct}% (${result.total} reviews) → ${result.lag.toFixed(2)}d lag`;','    opt.textContent=`Measured clean-review est.: ${pct}% → ${result.lag.toFixed(2)}d avg to Guru`;');

  document.open();
  document.write(s);
  document.close();
})().catch(e=>{document.getElementById("load").className="load err";document.getElementById("load").textContent="Could not load the projection console.\n\n"+(e&&e.message?e.message:e);});
</script>
</body>
</html>
